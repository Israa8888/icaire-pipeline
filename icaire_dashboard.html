<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICAIRE — Ethical AI Connections</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0b0f;--surface:#12141a;--surface2:#1a1d26;--border:rgba(255,255,255,0.08);
  --accent:#6C63FF;--accent2:#FF6B6B;--accent3:#43E97B;--accent4:#F7B731;
  --text:#F0F0F5;--muted:#6B7280;--t1:#FF6B6B;--t2:#6C63FF;--t3:#43E97B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1,h2,h3{font-family:'Syne',sans-serif}
.app{display:flex;flex-direction:column;min-height:100vh}
.header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface);position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:12px}
.logo-badge{width:36px;height:36px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:white}
.logo-text{font-family:'Syne',sans-serif;font-weight:700;font-size:16px}
.logo-sub{font-size:11px;color:var(--muted);margin-top:1px}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--accent3);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.nav{display:flex;gap:4px;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
.nav-btn{padding:8px 18px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-family:'Syne',sans-serif;font-weight:600;font-size:13px;cursor:pointer;transition:all .2s}
.nav-btn.active{background:var(--accent);color:white}
.nav-btn:hover:not(.active){background:var(--surface2);color:var(--text)}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--muted);font-size:14px}
.page{padding:24px;display:none}
.page.active{display:block}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;align-items:center}
.filter-label{font-size:12px;color:var(--muted);font-weight:500}
.filter-select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;outline:none}
.filter-select:focus{border-color:var(--accent)}
.clear-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer}
.clear-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:border-color .2s}
.metric:hover{border-color:var(--accent)}
.metric-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.metric-val{font-family:'Syne',sans-serif;font-size:28px;font-weight:800}
.metric-sub{font-size:11px;color:var(--muted);margin-top:4px}
.m-t1 .metric-val{color:var(--t1)}.m-t2 .metric-val{color:var(--t2)}.m-t3 .metric-val{color:var(--t3)}.m-email .metric-val{color:var(--accent4)}
.charts-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:16px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}
.chart-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px}
.bar-chart{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-label{font-size:12px;color:var(--text);min-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.bar-count{font-size:12px;color:var(--muted);min-width:32px;text-align:right}
.domain-bars{display:flex;flex-direction:column;gap:10px}
.domain-row{}
.domain-name{font-size:12px;color:var(--text);margin-bottom:4px;display:flex;justify-content:space-between}
.domain-track{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.domain-fill{height:100%;border-radius:5px}
.sector-list{display:flex;flex-direction:column;gap:10px}
.sector-row{display:flex;align-items:center;gap:10px}
.sector-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.sector-name{font-size:12px;color:var(--text);flex:1}
.sector-bar-track{width:100px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.sector-bar-fill{height:100%;border-radius:3px}
.sector-pct{font-size:12px;color:var(--muted);min-width:36px;text-align:right}
.bottom-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.map-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}
.map-area{background:#0d1117;border-radius:10px;height:220px;position:relative;overflow:hidden;margin-bottom:12px}
.map-grid-line{position:absolute;background:rgba(255,255,255,.05)}
.map-pin{position:absolute;transform:translate(-50%,-50%);cursor:pointer}
.pin-dot{border-radius:50%;border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:white;transition:transform .2s}
.pin-dot:hover{transform:scale(1.3)}
.pin-tooltip{position:absolute;bottom:120%;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:10px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;z-index:10}
.map-pin:hover .pin-tooltip{opacity:1}
.map-legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.leg-dot{width:8px;height:8px;border-radius:50%}
.city-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.city-item{background:var(--surface2);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center}
.city-name{font-size:11px;color:var(--muted)}
.city-count{font-size:14px;font-weight:600;font-family:'Syne',sans-serif}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.table-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.table-count{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;background:var(--surface2)}
td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(108,99,255,.05)}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge-t1{background:rgba(255,107,107,.15);color:var(--t1)}
.badge-t2{background:rgba(108,99,255,.15);color:var(--t2)}
.badge-t3{background:rgba(67,233,123,.15);color:var(--t3)}
.score-bar{display:flex;align-items:center;gap:6px}
.score-track{width:50px;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.score-fill{height:100%;border-radius:2px}
.status-badge{display:flex;align-items:center;gap:5px;font-size:11px}
.status-dot-sm{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.link{color:var(--accent);text-decoration:none;font-size:11px}
.link:hover{text-decoration:underline}
.pagination{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border-top:1px solid var(--border)}
.page-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.page-btn:disabled{opacity:.3;cursor:not-allowed}
.page-info{font-size:12px;color:var(--muted)}
.error-card{background:var(--surface);border:1px solid rgba(255,107,107,.3);border-radius:14px;padding:32px;text-align:center;max-width:500px;margin:60px auto}
.error-title{font-family:'Syne',sans-serif;font-size:18px;margin-bottom:12px;color:var(--accent2)}
.error-msg{font-size:13px;color:var(--muted);line-height:1.8}
code{background:var(--surface2);padding:2px 6px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">
      <div class="logo-badge">IC</div>
      <div>
        <div class="logo-text">ICAIRE Ethical AI Connections</div>
        <div class="logo-sub" id="last-updated">Loading data...</div>
      </div>
    </div>
    <div class="status">
      <div class="status-dot"></div>
      <span id="status-text">Connecting to Google Sheets</span>
    </div>
  </div>
  <div class="nav">
    <button class="nav-btn active" onclick="showPage('dashboard',this)">Dashboard</button>
    <button class="nav-btn" onclick="showPage('connections',this)">Connections</button>
    <button class="nav-btn" onclick="showPage('map',this)">Map</button>
  </div>
  <div id="page-dashboard" class="page active">
    <div class="loading" id="loading"><div class="spinner"></div><div class="loading-text">Loading from Google Sheets...</div></div>
    <div id="dashboard-content" style="display:none"></div>
  </div>
  <div id="page-connections" class="page"><div id="connections-content"></div></div>
  <div id="page-map" class="page"><div id="map-content"></div></div>
</div>
<script>
const SHEET_ID='1xL121AcZW6QHeW1AZzw1MV_5yVeqth02MW_G6dpW3Tk';
const SHEET_NAME='Connections';
let allData=[],filteredData=[],currentPage=1;
const PAGE_SIZE=25;
let filters={tier:'',domain:'',sector:'',city:'',status:''};
const COLORS=['#6C63FF','#43E97B','#FF6B6B','#F7B731','#06B6D4','#EC4899','#8B5CF6','#10B981'];
const SECTOR_COLORS={academia:'#6C63FF',industry:'#43E97B',government:'#F7B731',civil_society:'#FF6B6B'};
const CITY_POS={Riyadh:{x:52,y:52},Jeddah:{x:28,y:45},Thuwal:{x:25,y:38},Dhahran:{x:74,y:42},Dammam:{x:76,y:44},Abha:{x:35,y:70},Medina:{x:30,y:32},Tabuk:{x:22,y:22},Buraidah:{x:48,y:35},Taif:{x:34,y:52},Hail:{x:42,y:28},Jubail:{x:78,y:36}};

async function fetchData(){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
  try{
    const resp=await fetch(url);
    const text=await resp.text();
    const json=JSON.parse(text.substring(47).slice(0,-2));
    const cols=json.table.cols.map(c=>c.label);
    allData=json.table.rows.map(r=>{
      const obj={};
      r.c.forEach((cell,i)=>{obj[cols[i]]=cell?(cell.v!==null?String(cell.v):''):'';});
      return obj;
    }).filter(r=>r['Name']&&r['Name'].trim());
    filteredData=[...allData];
    document.getElementById('status-text').textContent=`${allData.length} people loaded`;
    document.getElementById('last-updated').textContent=`Live · ${allData.length} ethical AI connections`;
    document.getElementById('loading').style.display='none';
    document.getElementById('dashboard-content').style.display='block';
    renderAll();
  }catch(e){
    document.getElementById('loading').innerHTML=`
      <div class="error-card">
        <div class="error-title">Could not load data</div>
        <div class="error-msg">
          Make sure the Google Sheet is shared publicly:<br><br>
          <strong>Share → Anyone with the link → Viewer</strong><br><br>
          Sheet ID: <code>${SHEET_ID}</code><br><br>
          Error: ${e.message}
        </div>
      </div>`;
    document.getElementById('status-text').textContent='Connection failed';
  }
}

function applyFilters(){
  filteredData=allData.filter(r=>{
    if(filters.tier&&!String(r['Tier']).includes(filters.tier))return false;
    if(filters.domain&&!(r['UNESCO domain(s)']||'').toLowerCase().includes(filters.domain.toLowerCase()))return false;
    if(filters.sector&&(r['Sector']||'').toLowerCase()!==filters.sector.toLowerCase())return false;
    if(filters.city&&!(r['City']||'').toLowerCase().includes(filters.city.toLowerCase()))return false;
    if(filters.status&&r['Connection status']!==filters.status)return false;
    return true;
  });
  currentPage=1;
  renderAll();
}

function renderAll(){renderDashboard();renderConnections();renderMap();}

function getUniques(field){return[...new Set(allData.map(r=>r[field]).filter(Boolean))].sort();}
function getUniqueDomains(){return[...new Set(allData.flatMap(r=>(r['UNESCO domain(s)']||'').split(',').map(d=>d.trim())).filter(d=>d&&d!=='Not relevant'))].sort();}

function filterControls(extra=''){
  return`<div class="filters">
    <span class="filter-label">Filter:</span>
    <select class="filter-select" onchange="filters.tier=this.value;applyFilters()">
      <option value="">All tiers</option>
      <option value="1" ${filters.tier==='1'?'selected':''}>Tier 1 — Speaker</option>
      <option value="2" ${filters.tier==='2'?'selected':''}>Tier 2 — Partner</option>
      <option value="3" ${filters.tier==='3'?'selected':''}>Tier 3 — Research</option>
    </select>
    <select class="filter-select" onchange="filters.domain=this.value;applyFilters()">
      <option value="">All UNESCO domains</option>
      ${getUniqueDomains().map(d=>`<option value="${d}" ${filters.domain===d?'selected':''}>${d}</option>`).join('')}
    </select>
    <select class="filter-select" onchange="filters.sector=this.value;applyFilters()">
      <option value="">All sectors</option>
      ${getUniques('Sector').map(s=>`<option value="${s}" ${filters.sector===s?'selected':''}>${s}</option>`).join('')}
    </select>
    <select class="filter-select" onchange="filters.city=this.value;applyFilters()">
      <option value="">All cities</option>
      ${getUniques('City').map(c=>`<option value="${c}" ${filters.city===c?'selected':''}>${c}</option>`).join('')}
    </select>
    <select class="filter-select" onchange="filters.status=this.value;applyFilters()">
      <option value="">All status</option>
      ${getUniques('Connection status').map(s=>`<option value="${s}" ${filters.status===s?'selected':''}>${s}</option>`).join('')}
    </select>
    ${extra}
    <button class="clear-btn" onclick="filters={tier:'',domain:'',sector:'',city:'',status:''};document.querySelectorAll('.filter-select').forEach(s=>s.value='');applyFilters()">Clear all</button>
  </div>`;
}

function renderDashboard(){
  const d=filteredData,total=d.length;
  const t1=d.filter(r=>r['Tier']==='1').length;
  const t2=d.filter(r=>r['Tier']==='2').length;
  const t3=d.filter(r=>r['Tier']==='3').length;
  const withEmail=d.filter(r=>r['Email']?.includes('@')).length;
  const orgC={};d.forEach(r=>{const o=r['Organization']||'Unknown';orgC[o]=(orgC[o]||0)+1;});
  const topOrgs=Object.entries(orgC).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxOrg=topOrgs[0]?.[1]||1;
  const domC={};d.forEach(r=>{(r['UNESCO domain(s)']||'').split(',').forEach(dom=>{dom=dom.trim();if(dom&&dom!=='Not relevant')domC[dom]=(domC[dom]||0)+1;});});
  const topDoms=Object.entries(domC).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxDom=topDoms[0]?.[1]||1;
  const secC={};d.forEach(r=>{const s=r['Sector']||'unknown';secC[s]=(secC[s]||0)+1;});
  const stC={};d.forEach(r=>{const s=r['Connection status']||'Not contacted';stC[s]=(stC[s]||0)+1;});
  const relC={};d.forEach(r=>{const v=r['AI relationship']||'Unknown';relC[v]=(relC[v]||0)+1;});

  document.getElementById('dashboard-content').innerHTML=`
    ${filterControls()}
    <div class="metrics">
      <div class="metric"><div class="metric-label">Total people</div><div class="metric-val">${total}</div><div class="metric-sub">ethical AI connections</div></div>
      <div class="metric m-t1"><div class="metric-label">Tier 1 — Speakers</div><div class="metric-val">${t1}</div><div class="metric-sub">ready to contact</div></div>
      <div class="metric m-t2"><div class="metric-label">Tier 2 — Partners</div><div class="metric-val">${t2}</div><div class="metric-sub">decision makers</div></div>
      <div class="metric m-t3"><div class="metric-label">Tier 3 — Research</div><div class="metric-val">${t3}</div><div class="metric-sub">academics</div></div>
      <div class="metric m-email"><div class="metric-label">With email</div><div class="metric-val">${withEmail}</div><div class="metric-sub">directly contactable</div></div>
    </div>
    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">People by organisation</div>
        <div class="bar-chart">${topOrgs.map(([o,c],i)=>`
          <div class="bar-row">
            <div class="bar-label" title="${o}">${o}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${c/maxOrg*100}%;background:${COLORS[i%8]}"></div></div>
            <div class="bar-count">${c}</div>
          </div>`).join('')}
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-title">UNESCO domains</div>
        <div class="domain-bars">${topDoms.map(([dom,c],i)=>`
          <div class="domain-row">
            <div class="domain-name"><span>${dom}</span><span style="color:var(--muted)">${c}</span></div>
            <div class="domain-track"><div class="domain-fill" style="width:${c/maxDom*100}%;background:${COLORS[i%8]}"></div></div>
          </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="bottom-grid">
      <div class="chart-card">
        <div class="chart-title">Sector</div>
        <div class="sector-list">${Object.entries(secC).map(([s,c])=>`
          <div class="sector-row">
            <div class="sector-dot" style="background:${SECTOR_COLORS[s]||'#888'}"></div>
            <div class="sector-name">${s}</div>
            <div class="sector-bar-track"><div class="sector-bar-fill" style="width:${c/total*100}%;background:${SECTOR_COLORS[s]||'#888'}"></div></div>
            <div class="sector-pct">${Math.round(c/total*100)}%</div>
          </div>`).join('')}
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Connection status</div>
        <div class="sector-list">${Object.entries(stC).map(([s,c])=>`
          <div class="sector-row">
            <div class="sector-dot" style="background:${s==='Connected'?'#43E97B':s==='Reached out'?'#F7B731':'#6B7280'}"></div>
            <div class="sector-name">${s}</div>
            <div class="sector-bar-track"><div class="sector-bar-fill" style="width:${c/total*100}%;background:${s==='Connected'?'#43E97B':s==='Reached out'?'#F7B731':'#6B7280'}"></div></div>
            <div class="sector-pct">${c}</div>
          </div>`).join('')}
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-title">AI relationship</div>
        <div class="sector-list">${Object.entries(relC).map(([s,c])=>`
          <div class="sector-row">
            <div class="sector-dot" style="background:${s.includes('Primary')?'#6C63FF':'#FF6B6B'}"></div>
            <div class="sector-name">${s}</div>
            <div class="sector-bar-track"><div class="sector-bar-fill" style="width:${c/total*100}%;background:${s.includes('Primary')?'#6C63FF':'#FF6B6B'}"></div></div>
            <div class="sector-pct">${Math.round(c/total*100)}%</div>
          </div>`).join('')}
        </div>
      </div>
    </div>`;
}

function renderConnections(){
  const d=filteredData;
  const start=(currentPage-1)*PAGE_SIZE;
  const pageData=d.slice(start,start+PAGE_SIZE);
  const totalPages=Math.ceil(d.length/PAGE_SIZE);
  document.getElementById('connections-content').innerHTML=`
    ${filterControls()}
    <div class="table-wrap">
      <div class="table-header">
        <span style="font-family:'Syne',sans-serif;font-weight:700">Connections</span>
        <span class="table-count">Showing ${start+1}–${Math.min(start+PAGE_SIZE,d.length)} of ${d.length}</span>
      </div>
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>Name</th><th>Title</th><th>Organisation</th><th>City</th>
          <th>UNESCO domain</th><th>Ethical AI skills</th><th>Tier</th>
          <th>Score</th><th>Email</th><th>LinkedIn</th><th>Status</th>
        </tr></thead>
        <tbody>${pageData.map(r=>`
          <tr>
            <td style="font-weight:500;white-space:nowrap">${r['Name']||''}</td>
            <td style="color:var(--muted);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r['Title / Role']||''}">${r['Title / Role']||'—'}</td>
            <td style="white-space:nowrap">${r['Organization']||'—'}</td>
            <td style="white-space:nowrap">${r['City']||'—'}</td>
            <td style="max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px" title="${r['UNESCO domain(s)']||''}">${r['UNESCO domain(s)']||'—'}</td>
            <td style="max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px" title="${r['Ethical AI skill(s)']||''}">${r['Ethical AI skill(s)']||'—'}</td>
            <td><span class="badge badge-t${r['Tier']||3}">T${r['Tier']||'—'}</span></td>
            <td><div class="score-bar"><div class="score-track"><div class="score-fill" style="width:${r['Priority score']||0}%;background:${Number(r['Priority score'])>=70?'#43E97B':Number(r['Priority score'])>=50?'#F7B731':'#6B7280'}"></div></div><span style="font-size:11px;color:var(--muted)">${r['Priority score']||'—'}</span></div></td>
            <td style="font-size:11px">${r['Email']?`<a href="mailto:${r['Email']}" class="link">${r['Email']}</a>`:'—'}</td>
            <td>${r['LinkedIn URL']?`<a href="${r['LinkedIn URL']}" target="_blank" class="link">↗ View</a>`:'—'}</td>
            <td><div class="status-badge"><div class="status-dot-sm" style="background:${r['Connection status']==='Connected'?'#43E97B':r['Connection status']==='Reached out'?'#F7B731':'#6B7280'}"></div><span style="font-size:11px;color:var(--muted)">${r['Connection status']||'—'}</span></div></td>
          </tr>`).join('')}
        </tbody>
      </table>
      </div>
      <div class="pagination">
        <button class="page-btn" onclick="changePage(currentPage-1)" ${currentPage===1?'disabled':''}>←</button>
        <span class="page-info">Page ${currentPage} of ${totalPages}</span>
        <button class="page-btn" onclick="changePage(currentPage+1)" ${currentPage===totalPages?'disabled':''}>→</button>
      </div>
    </div>`;
}

function renderMap(){
  const d=filteredData;
  const cityC={};
  d.forEach(r=>{
    const c=r['City']||'Unknown';
    if(!cityC[c])cityC[c]={total:0,t1:0,t2:0,t3:0};
    cityC[c].total++;
    if(r['Tier']==='1')cityC[c].t1++;
    else if(r['Tier']==='2')cityC[c].t2++;
    else cityC[c].t3++;
  });
  const topCities=Object.entries(cityC).filter(([c])=>c!=='Unknown'&&c!=='Saudi Arabia').sort((a,b)=>b[1].total-a[1].total).slice(0,10);
  const maxCity=topCities[0]?.[1].total||1;

  document.getElementById('map-content').innerHTML=`
    ${filterControls()}
    <div class="map-card">
      <div class="chart-title">Location map — Saudi Arabia</div>
      <div class="map-area">
        ${[...Array(6)].map((_,i)=>`<div class="map-grid-line" style="top:${i*20}%;left:0;right:0;height:1px"></div>`).join('')}
        ${[...Array(6)].map((_,i)=>`<div class="map-grid-line" style="left:${i*20}%;top:0;bottom:0;width:1px"></div>`).join('')}
        ${topCities.map(([city,counts])=>{
          const pos=CITY_POS[city];
          if(!pos)return'';
          const size=Math.max(22,Math.min(46,22+counts.total/maxCity*24));
          const dom=counts.t1>counts.t2&&counts.t1>counts.t3?'#FF6B6B':counts.t2>counts.t3?'#6C63FF':'#43E97B';
          return`<div class="map-pin" style="left:${pos.x}%;top:${pos.y}%">
            <div class="pin-dot" style="width:${size}px;height:${size}px;background:${dom};font-size:${size>30?10:8}px">${counts.total}</div>
            <div class="pin-tooltip">${city}: ${counts.total} · T1:${counts.t1} T2:${counts.t2} T3:${counts.t3}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="map-legend">
        <div class="leg-item"><div class="leg-dot" style="background:var(--t1)"></div>Tier 1 Speaker</div>
        <div class="leg-item"><div class="leg-dot" style="background:var(--t2)"></div>Tier 2 Partner</div>
        <div class="leg-item"><div class="leg-dot" style="background:var(--t3)"></div>Tier 3 Research</div>
      </div>
      <div class="city-grid">
        ${topCities.slice(0,8).map(([city,counts])=>`
          <div class="city-item">
            <span class="city-name">${city}</span>
            <span class="city-count">${counts.total}</span>
          </div>`).join('')}
      </div>
    </div>`;
}

function changePage(p){
  const tp=Math.ceil(filteredData.length/PAGE_SIZE);
  if(p<1||p>tp)return;
  currentPage=p;
  renderConnections();
  window.scrollTo(0,0);
}

function showPage(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  btn.classList.add('active');
}

fetchData();
</script>
</body>
</html>
